<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lampton Appreciation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        .bunting { clip-path: polygon(0% 0%, 100% 0%, 50% 100%); }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD_nLssSVEfRL-x1KM1574KHBIcnhdS4Ck",
            authDomain: "lampton-appreciation.firebaseapp.com",
            projectId: "lampton-appreciation",
            storageBucket: "lampton-appreciation.firebasestorage.app",
            messagingSenderId: "721268982987",
            appId: "1:721268982987:web:5d8b978e6f3dc69e7b91ce"
        };

        const app = initializeApp(firebaseConfig);
        window.fb = { auth: getAuth(app), db: getFirestore(app), collection, addDoc, onSnapshot, serverTimestamp, signInAnonymously };
    </script>

    <script type="text/babel">
        const { useState, useEffect } = React;
        function App() {
            const [signups, setSignups] = useState([]);
            const [name, setName] = useState('');

            useEffect(() => {
                const check = setInterval(() => {
                    if (window.fb) {
                        clearInterval(check);
                        window.fb.signInAnonymously(window.fb.auth);
                        window.fb.onSnapshot(window.fb.collection(window.fb.db, 'signups'), (s) => {
                            setSignups(s.docs.map(d => ({id: d.id, ...d.data()})));
                        });
                    }
                }, 100);
            }, []);

            const save = async (e) => {
                e.preventDefault();
                await window.fb.addDoc(window.fb.collection(window.fb.db, 'signups'), { name, timestamp: window.fb.serverTimestamp() });
                setName('');
            };

            return (
                <div className="max-w-md mx-auto p-4">
                    <div className="bg-white rounded-3xl shadow-xl overflow-hidden border-t-8 border-blue-600">
                        <div className="p-8 text-center">
                            <div className="text-6xl mb-4">🍎</div>
                            <h1 className="text-3xl font-black uppercase text-slate-800 leading-none">Teacher<br/>Appreciation</h1>
                            <div className="mt-4 inline-block bg-yellow-400 px-4 py-2 rounded-full font-black text-blue-900 border-2 border-blue-900">MAY 4-8</div>
                        </div>
                        <form onSubmit={save} className="p-6 bg-slate-50 border-t border-b flex flex-col gap-3">
                            <input required className="p-4 rounded-xl border-2 border-slate-200 font-bold" placeholder="Your Name" value={name} onChange={e => setName(e.target.value)} />
                            <button className="bg-blue-600 text-white font-black py-4 rounded-xl uppercase">Sign Up ❤️</button>
                        </form>
                        <div className="p-6">
                            <h2 className="font-black text-slate-400 uppercase text-xs mb-4 tracking-widest">Volunteers:</h2>
                            {signups.map(s => <div key={s.id} className="bg-white p-3 rounded-lg mb-2 shadow-sm border font-bold text-slate-700">{s.name}</div>)}
                        </div>
                    </div>
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
