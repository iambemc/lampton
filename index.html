
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lampton Teacher Appreciation Sign-up</title>

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-HX3QW1SMSF"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-HX3QW1SMSF');
    </script>

    <!-- UI Resources -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .clip-bunting { clip-path: polygon(0% 0%, 100% 0%, 50% 100%); }
        #root:empty { display: none; }
    </style>
</head>
<body class="bg-[#f8fafc]">
    <div id="root"></div>

    <!-- Firebase Configuration & Setup -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD_nLssSVEfRL-x1KM1574KHBIcnhdS4Ck",
            authDomain: "lampton-appreciation.firebaseapp.com",
            projectId: "lampton-appreciation",
            storageBucket: "lampton-appreciation.firebasestorage.app",
            messagingSenderId: "721268982987",
            appId: "1:721268982987:web:5d8b978e6f3dc69e7b91ce",
            measurementId: "G-HX3QW1SMSF"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Making Firebase accessible to the React component
        window.fb = { auth, db, collection, addDoc, onSnapshot, deleteDoc, doc, serverTimestamp, signInAnonymously, onAuthStateChanged };
    </script>

    <!-- App Logic -->
    <script type="text/babel">
        const { useState, useEffect } = React;

        const MAX_SLOTS = 4;
        const DAYS = [
            { id: 'monday', name: 'Monday', theme: 'Coffee & Breakfast', items: ['Coffee', 'Bagels', 'Juice', 'Cream Cheese Tubs'], color: 'bg-red-500', textColor: 'text-red-700', allow: true, emoji: '☕' },
            { id: 'tuesday', name: 'Tuesday', theme: 'Fresh & Fancy', items: ['Fruit Platters', 'Charcuterie Board'], color: 'bg-purple-600', textColor: 'text-purple-700', allow: true, emoji: '🥗' },
            { id: 'wednesday', name: 'Wednesday', theme: 'PTA Provided Lunch', items: ['PTA will provide lunch'], color: 'bg-sky-500', textColor: 'text-sky-700', allow: false, emoji: '🌮' },
            { id: 'thursday', name: 'Thursday', theme: 'Sweet Treats', items: ['Cookies', 'Muffins'], color: 'bg-green-500', textColor: 'text-green-700', allow: true, emoji: '🍪' },
            { id: 'friday', name: 'Friday', theme: 'Thirst Quencher', items: ['Lemonade'], color: 'bg-orange-500', textColor: 'text-orange-700', allow: true, emoji: '🍋' }
        ];

        function App() {
            const [user, setUser] = useState(null);
            const [signups, setSignups] = useState([]);
            const [formData, setFormData] = useState({ name: '', item: '', dayId: 'monday' });
            const [isAdmin, setIsAdmin] = useState(false);
            const [adminInput, setAdminInput] = useState('');
            const [showAdmin, setShowAdmin] = useState(false);
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const init = setInterval(() => {
                    if (window.fb) {
                        clearInterval(init);
                        window.fb.signInAnonymously(window.fb.auth).catch(console.error);
                        window.fb.onAuthStateChanged(window.fb.auth, (u) => {
                            setUser(u);
                            setLoading(false);
                        });
                    }
                }, 100);
            }, []);

            useEffect(() => {
                if (!user || !window.fb) return;
                const q = window.fb.collection(window.fb.db, 'signups');
                return window.fb.onSnapshot(q, (snapshot) => {
                    const data = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                    setSignups(data.sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0)));
                }, (err) => {
                    setError("Database access error. Please check your Firebase rules.");
                });
            }, [user]);

            const getItemCount = (dayId, item) => signups.filter(s => s.dayId === dayId && s.item === item).length;

            const handleSignup = async (e) => {
                e.preventDefault();
                if (!formData.name || !formData.item) return setError("Please fill in all fields.");
                if (getItemCount(formData.dayId, formData.item) >= MAX_SLOTS) return setError("This slot is already full!");

                setError('');
                try {
                    await window.fb.addDoc(window.fb.collection(window.fb.db, 'signups'), {
                        ...formData,
                        timestamp: window.fb.serverTimestamp(),
                        uid: user.uid
                    });
                    setFormData({...formData, item: ''});
                } catch (err) {
                    setError("Failed to save. Make sure Firestore Rules are set to 'true'.");
                }
            };

            const eraseEntry = async (id) => {
                if (!isAdmin) return;
                try {
                    await window.fb.deleteDoc(window.fb.doc(window.fb.db, 'signups', id));
                } catch (err) {
                    console.error("Delete failed:", err);
                }
            };

            const currentDay = DAYS.find(d => d.id === formData.dayId);

            if (loading) return null;

            return (
                <div className="pb-24">
                    {/* Festive Header */}
                    <header className="bg-white border-b-4 border-blue-600 relative pt-14 pb-12 px-4 text-center shadow-md">
                        {/* Soft fabric bunting flags */}
                        <div className="absolute top-0 left-0 right-0 flex justify-center -space-x-1 overflow-hidden h-16">
                            {[...Array(15)].map((_, i) => (
                                <div key={i} className={`w-16 h-12 md:w-20 md:h-14 ${i % 2 === 0 ? 'bg-blue-600' : 'bg-yellow-400'} clip-bunting shadow-sm`}></div>
                            ))}
                        </div>
                        
                        <div className="max-w-4xl mx-auto mt-6">
                            <div className="flex items-center justify-center gap-4 mb-4">
                                <span className="text-4xl md:text-6xl drop-shadow-sm">🍎</span>
                                <h1 className="text-4xl md:text-7xl font-[1000] tracking-tighter uppercase leading-none text-slate-800">
                                    Teacher & Staff <br/>
                                    <span className="text-blue-700">Appreciation</span>
                                </h1>
                                <span className="text-4xl md:text-6xl drop-shadow-sm">🍎</span>
                            </div>
                            
                            {/* Straight, Bold Date Badge */}
                            <div className="inline-block bg-yellow-400 px-8 py-3 rounded-full font-black text-2xl md:text-4xl text-blue-900 border-4 border-blue-900 shadow-xl uppercase tracking-tight">
                                MAY 4-8, 2026
                            </div>
                            
                            <p className="mt-8 text-xl font-bold text-slate-500 italic max-w-xl mx-auto">
                                Lampton Elementary &bull; Shared Sign-up Sheet
                            </p>
                        </div>
                    </header>

                    <main className="max-w-4xl mx-auto px-4 mt-8 space-y-8">
                        {/* Signup Form Section */}
                        <section className="bg-white rounded-[2.5rem] shadow-xl p-6 md:p-10 border-2 border-slate-100">
                            <h3 className="text-2xl font-black mb-6 flex items-center gap-3">
                                <span className="text-blue-600 text-3xl">➕</span> Add My Item
                            </h3>
                            <form onSubmit={handleSignup} className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                <div className="flex flex-col gap-1">
                                    <label className="text-[10px] font-black uppercase text-slate-400 ml-2">Volunteer Name</label>
                                    <input required placeholder="Your Name" className="p-4 rounded-2xl border-2 border-slate-100 font-bold outline-none focus:border-blue-500 bg-slate-50 focus:bg-white transition-all" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} />
                                </div>
                                <div className="flex flex-col gap-1">
                                    <label className="text-[10px] font-black uppercase text-slate-400 ml-2">Select Day</label>
                                    <select className="p-4 rounded-2xl border-2 border-slate-100 bg-white font-bold cursor-pointer" value={formData.dayId} onChange={e => setFormData({...formData, dayId: e.target.value, item: ''})}>
                                        {DAYS.filter(d => d.allow).map(d => <option key={d.id} value={d.id}>{d.name}</option>)}
                                    </select>
                                </div>
                                <div className="flex flex-col gap-1">
                                    <label className="text-[10px] font-black uppercase text-slate-400 ml-2">Requested Item</label>
                                    <select required className="p-4 rounded-2xl border-2 border-slate-100 bg-white font-bold cursor-pointer" value={formData.item} onChange={e => setFormData({...formData, item: e.target.value})}>
                                        <option value="">Choose item...</option>
                                        {currentDay?.items.map(item => {
                                            const count = getItemCount(formData.dayId, item);
                                            return (
                                                <option key={item} value={item} disabled={count >= MAX_SLOTS}>
                                                    {item} ({count}/{MAX_SLOTS} filled)
                                                </option>
                                            )
                                        })}
                                    </select>
                                </div>
                                <button className="md:col-span-3 py-5 bg-blue-700 text-white font-black text-xl rounded-2xl uppercase tracking-widest shadow-lg active:scale-95 transition-all hover:bg-blue-800">
                                    Confirm Sign-up ❤️
                                </button>
                                {error && <p className="md:col-span-3 text-red-500 font-bold text-center bg-red-50 p-3 rounded-xl border border-red-100">{error}</p>}
                            </form>
                        </section>

                        {/* List Cards */}
                        <div className="space-y-10">
                            {DAYS.map(day => {
                                const dayList = signups.filter(s => s.dayId === day.id);
                                return (
                                    <div key={day.id} className="bg-white rounded-[3rem] shadow-lg overflow-hidden border-2 border-slate-50">
                                        <div className={`${day.color} p-8 flex justify-between items-center text-white`}>
                                            <div>
                                                <h4 className="text-4xl md:text-6xl font-black uppercase leading-none tracking-tighter">{day.name}</h4>
                                                <p className="font-bold opacity-90 uppercase tracking-[0.2em] text-xs mt-2">{day.theme}</p>
                                            </div>
                                            <div className="text-5xl drop-shadow-md">{day.emoji}</div>
                                        </div>
                                        
                                        <div className="p-8 md:p-12 space-y-8">
                                            {/* Status Grid */}
                                            <div className="flex flex-wrap gap-3">
                                                <span className="text-[10px] font-black uppercase text-slate-300 w-full mb-1 tracking-widest">Availability:</span>
                                                {day.items.map(item => {
                                                    const count = getItemCount(day.id, item);
                                                    const isFull = count >= MAX_SLOTS;
                                                    return (
                                                        <span key={item} className={`px-4 py-2 rounded-2xl text-xs font-black uppercase border-2 flex items-center gap-2 transition-all ${isFull ? 'bg-green-100 border-green-200 text-green-700' : 'bg-slate-50 border-slate-100 text-slate-400'}`}>
                                                            {isFull && "✅"} {item} ({count}/{MAX_SLOTS})
                                                        </span>
                                                    )
                                                })}
                                            </div>

                                            <hr className="border-slate-100" />

                                            {/* Signups List */}
                                            {!day.allow ? (
                                                <div className="bg-sky-50 border-4 border-dashed border-sky-200 p-10 rounded-[2rem] text-center text-sky-800 font-black">
                                                    <div className="text-5xl mb-4">🌮</div>
                                                    <p className="text-2xl uppercase tracking-tight mb-2">PTA is providing lunch!</p>
                                                    <p className="opacity-70 text-sm italic">No volunteer items needed for Wednesday.</p>
                                                </div>
                                            ) : (
                                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                                    <span className="text-[10px] font-black uppercase text-slate-300 col-span-full tracking-widest">Volunteer List:</span>
                                                    {dayList.length === 0 ? (
                                                        <p className="col-span-full text-center text-slate-300 italic font-bold py-6">No one has signed up yet!</p>
                                                    ) : dayList.map(s => (
                                                        <div key={s.id} className="bg-slate-50 p-5 rounded-[1.5rem] border-2 border-white shadow-sm flex justify-between items-center group hover:bg-white hover:border-slate-100 transition-all">
                                                            <div>
                                                                <p className="font-black text-slate-800 text-lg leading-none">{s.name}</p>
                                                                <p className={`text-[10px] font-black uppercase mt-1 tracking-widest ${day.textColor}`}>{s.item}</p>
                                                            </div>
                                                            {isAdmin && (
                                                                <button onClick={() => eraseEntry(s.id)} className="bg-red-50 text-red-500 font-black text-[10px] uppercase px-3 py-2 rounded-xl hover:bg-red-500 hover:text-white transition-all shadow-sm">Erase</button>
                                                            )}
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>

                        {/* Colorful Footer Icons */}
                        <footer className="text-center pt-20 border-t border-slate-100">
                            <div className="flex justify-center gap-10 mb-10">
                                <span className="text-6xl drop-shadow-md">🍎</span>
                                <span className="text-6xl drop-shadow-md">✏️</span>
                                <span className="text-6xl drop-shadow-md">🖍️</span>
                            </div>
                            <div className="flex flex-col items-center gap-4">
                                <p className="text-xs font-black uppercase text-slate-400 tracking-[0.3em]">Supporting Lampton Elementary</p>
                                <p className="text-[11px] text-slate-500 font-black uppercase tracking-widest">Design with <span className="text-yellow-500 text-sm">💛</span> by Scanista</p>
                                
                                {isAdmin ? (
                                    <button onClick={() => setIsAdmin(false)} className="text-[10px] text-green-500 font-bold uppercase border-2 border-green-100 px-4 py-1 rounded-full bg-white shadow-sm">Admin Dashboard Active (Logout)</button>
                                ) : (
                                    <button onClick={() => setShowAdmin(true)} className="text-[10px] text-slate-300 font-bold uppercase hover:text-slate-500 transition-colors">Admin Portal</button>
                                )}
                            </div>
                        </footer>
                    </main>

                    {/* Admin Portal Modal */}
                    {showAdmin && (
                        <div className="fixed inset-0 bg-slate-900/90 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-[2.5rem] p-10 w-full max-w-sm border-4 border-blue-600 shadow-2xl animate-in fade-in zoom-in duration-200">
                                <h3 className="text-2xl font-black uppercase mb-6 text-center text-slate-800">Admin Login</h3>
                                <input autoFocus type="password" placeholder="Password" className="w-full p-4 border-2 border-slate-100 rounded-2xl mb-4 font-bold text-center tracking-widest text-xl outline-none focus:border-blue-500 bg-slate-50" value={adminInput} onChange={e => setAdminInput(e.target.value)} />
                                <div className="flex flex-col gap-2">
                                    <button onClick={() => { if(adminInput === 'Blue'){ setIsAdmin(true); setShowAdmin(false); setAdminInput(''); } else { alert('Incorrect Password'); } }} className="w-full py-4 bg-blue-600 text-white font-black rounded-2xl uppercase shadow-lg active:scale-95 transition-all">Unlock Portal</button>
                                    <button onClick={() => setShowAdmin(false)} className="w-full py-2 text-[10px] font-black text-slate-400 uppercase tracking-widest">Cancel</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

```
