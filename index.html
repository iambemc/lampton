<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lampton Teacher Appreciation Sign-up</title>

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-HX3QW1SMSF"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-HX3QW1SMSF');
    </script>

    <!-- UI Resources -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; overflow-x: hidden; background-color: #f8fafc; }
        .bunting-flag { clip-path: polygon(0% 0%, 100% 0%, 50% 100%); }
        #root:empty { display: none; }
        .card-shadow { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- Firebase SDK Implementation -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD_nLssSVEfRL-x1KM1574KHBIcnhdS4Ck",
            authDomain: "lampton-appreciation.firebaseapp.com",
            projectId: "lampton-appreciation",
            storageBucket: "lampton-appreciation.firebasestorage.app",
            messagingSenderId: "721268982987",
            appId: "1:721268982987:web:5d8b978e6f3dc69e7b91ce",
            measurementId: "G-HX3QW1SMSF"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.portalFirebase = { auth, db, collection, addDoc, onSnapshot, deleteDoc, doc, serverTimestamp, signInAnonymously, onAuthStateChanged };
    </script>

    <!-- React Application Logic -->
    <script type="text/babel">
        const { useState, useEffect } = React;

        const MAX_SLOTS = 4;
        const DAYS = [
            { id: 'monday', name: 'Monday', theme: 'Coffee & Breakfast', items: ['Coffee', 'Bagels', 'Juice', 'Cream Cheese Tubs'], color: 'bg-[#ef4444]', textColor: 'text-red-700', allow: true, emoji: '☕' },
            { id: 'tuesday', name: 'Tuesday', theme: 'Fresh & Fancy', items: ['Fruit Platters', 'Charcuterie Board'], color: 'bg-[#9333ea]', textColor: 'text-purple-700', allow: true, emoji: '🥗' },
            { id: 'wednesday', name: 'Wednesday', theme: 'PTA Provided Lunch', items: ['PTA will provide lunch'], color: 'bg-[#0ea5e9]', textColor: 'text-sky-700', allow: false, emoji: '🌮' },
            { id: 'thursday', name: 'Thursday', theme: 'Sweet Treats', items: ['Cookies', 'Muffins'], color: 'bg-[#22c55e]', textColor: 'text-green-700', allow: true, emoji: '🍪' },
            { id: 'friday', name: 'Friday', theme: 'Thirst Quencher', items: ['Lemonade'], color: 'bg-[#f97316]', textColor: 'text-orange-700', allow: true, emoji: '🍋' }
        ];

        function App() {
            const [user, setUser] = useState(null);
            const [signups, setSignups] = useState([]);
            const [formData, setFormData] = useState({ name: '', item: '', dayId: 'monday' });
            const [isAdmin, setIsAdmin] = useState(false);
            const [adminInput, setAdminInput] = useState('');
            const [showAdmin, setShowAdmin] = useState(false);
            const [error, setError] = useState('');
            const [isSubmitting, setIsSubmitting] = useState(false);

            useEffect(() => {
                const interval = setInterval(() => {
                    if (window.portalFirebase) {
                        clearInterval(interval);
                        const fb = window.portalFirebase;
                        fb.signInAnonymously(fb.auth).catch(console.error);
                        fb.onAuthStateChanged(fb.auth, setUser);
                    }
                }, 100);
            }, []);

            useEffect(() => {
                if (!user || !window.portalFirebase) return;
                const fb = window.portalFirebase;
                const q = fb.collection(fb.db, 'signups');
                return fb.onSnapshot(q, (snapshot) => {
                    const data = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                    setSignups(data.sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0)));
                }, (err) => {
                    setError("Database error. Ensure Firestore Rules are set to 'true'.");
                });
            }, [user]);

            const getItemCount = (dayId, item) => signups.filter(s => s.dayId === dayId && s.item === item).length;

            const handleSignup = async (e) => {
                e.preventDefault();
                if (!formData.name || !formData.item) return setError("Please enter your name and select an item.");
                if (getItemCount(formData.dayId, formData.item) >= MAX_SLOTS) return setError("This slot is already full!");

                setIsSubmitting(true);
                setError('');
                try {
                    const fb = window.portalFirebase;
                    await fb.addDoc(fb.collection(fb.db, 'signups'), {
                        ...formData,
                        timestamp: fb.serverTimestamp(),
                        uid: user.uid
                    });
                    setFormData({...formData, item: ''});
                } catch (err) {
                    setError("Failed to save. Check your Firebase Rules tab.");
                } finally {
                    setIsSubmitting(false);
                }
            };

            const eraseSignup = async (id) => {
                if (!isAdmin) return;
                try {
                    const fb = window.portalFirebase;
                    await fb.deleteDoc(fb.doc(fb.db, 'signups', id));
                } catch (err) {
                    console.error("Erase error:", err);
                }
            };

            const currentDay = DAYS.find(d => d.id === formData.dayId);

            return (
                <div className="pb-24 antialiased">
                    <header className="bg-white border-b-4 border-blue-600 relative pt-16 pb-12 px-2 md:px-4 text-center card-shadow">
                        {/* Bunting Header */}
                        <div className="absolute top-0 left-0 right-0 flex justify-center gap-2 overflow-hidden h-14 pointer-events-none">
                            {[...Array(14)].map((_, i) => (
                                <div key={i} className={`flex-shrink-0 w-16 h-12 md:w-24 md:h-16 ${i % 2 === 0 ? 'bg-blue-600' : 'bg-yellow-400'} bunting-flag shadow-sm`}></div>
                            ))}
                        </div>
                        
                        <div className="max-w-4xl mx-auto mt-6 px-2">
                            <div className="flex items-center justify-center gap-2 md:gap-6 mb-6">
                                <span className="text-4xl md:text-7xl flex-shrink-0">🍎</span>
                                <h1 className="text-4xl md:text-8xl font-[900] tracking-tighter uppercase leading-none text-slate-800">
                                    Teacher & Staff <br/>
                                    <span className="text-blue-700">Appreciation</span>
                                </h1>
                                <span className="text-4xl md:text-7xl flex-shrink-0">🍎</span>
                            </div>
                            
                            <div className="inline-block bg-yellow-400 px-8 py-3 md:px-10 md:py-4 rounded-full font-black text-xl md:text-5xl text-blue-900 border-4 border-blue-900 shadow-xl uppercase tracking-tighter">
                                MAY 4-8, 2026
                            </div>
                            
                            <p className="mt-8 text-lg md:text-2xl font-bold text-slate-500 italic max-w-2xl mx-auto leading-relaxed">
                                Lampton Elementary &bull; Shared Sign-up Sheet
                            </p>
                        </div>
                    </header>

                    <main className="max-w-4xl mx-auto px-4 mt-12 space-y-10">
                        <section className="bg-white rounded-[3rem] shadow-2xl p-6 md:p-12 border-2 border-slate-100">
                            <h3 className="text-2xl md:text-3xl font-black mb-8 flex items-center gap-4 text-slate-800">
                                <span className="bg-blue-600 text-white p-2 rounded-2xl">➕</span> Add My Item
                            </h3>
                            <form onSubmit={handleSignup} className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                <div className="flex flex-col gap-2">
                                    <label className="text-xs font-black uppercase text-slate-400 ml-3 tracking-widest">Your Name</label>
                                    <input required placeholder="Name" className="p-5 rounded-[1.5rem] border-2 border-slate-100 font-bold outline-none focus:border-blue-500 bg-slate-50 focus:bg-white transition-all text-lg" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} />
                                </div>
                                <div className="flex flex-col gap-2">
                                    <label className="text-xs font-black uppercase text-slate-400 ml-3 tracking-widest">Select Day</label>
                                    <select className="p-5 rounded-[1.5rem] border-2 border-slate-100 bg-white font-bold cursor-pointer text-lg appearance-none" value={formData.dayId} onChange={e => setFormData({...formData, dayId: e.target.value, item: ''})}>
                                        {DAYS.filter(d => d.allow).map(d => <option key={d.id} value={d.id}>{d.name}</option>)}
                                    </select>
                                </div>
                                <div className="flex flex-col gap-2">
                                    <label className="text-xs font-black uppercase text-slate-400 ml-3 tracking-widest">Item to Bring</label>
                                    <select required className="p-5 rounded-[1.5rem] border-2 border-slate-100 bg-white font-bold cursor-pointer text-lg appearance-none" value={formData.item} onChange={e => setFormData({...formData, item: e.target.value})}>
                                        <option value="">Choose item...</option>
                                        {currentDay?.items.map(item => {
                                            const count = getItemCount(formData.dayId, item);
                                            return (
                                                <option key={item} value={item} disabled={count >= MAX_SLOTS}>
                                                    {item} ({count}/{MAX_SLOTS} filled)
                                                </option>
                                            )
                                        })}
                                    </select>
                                </div>
                                <button disabled={isSubmitting} className="md:col-span-3 py-6 bg-blue-700 text-white font-black text-xl md:text-2xl rounded-[1.5rem] uppercase tracking-widest shadow-xl active:scale-[0.98] transition-all hover:bg-blue-800 disabled:opacity-50">
                                    {isSubmitting ? "Saving..." : "Confirm Sign-up ❤️"}
                                </button>
                                {error && <p className="md:col-span-3 text-red-500 font-black text-center bg-red-50 p-4 rounded-2xl border border-red-100 animate-pulse">{error}</p>}
                            </form>
                        </section>

                        <div className="space-y-12">
                            {DAYS.map(day => {
                                const dayList = signups.filter(s => s.dayId === day.id);
                                return (
                                    <div key={day.id} className="bg-white rounded-[3.5rem] shadow-xl overflow-hidden border-2 border-slate-50 transition-transform hover:scale-[1.01] duration-300">
                                        <div className={`${day.color} p-8 md:p-10 flex justify-between items-center text-white`}>
                                            <div>
                                                <h4 className="text-3xl md:text-7xl font-black uppercase leading-none tracking-tighter">{day.name}</h4>
                                                <p className="font-bold opacity-90 uppercase tracking-[0.3em] text-xs md:text-sm mt-3">{day.theme}</p>
                                            </div>
                                            <div className="text-5xl md:text-6xl drop-shadow-2xl">{day.emoji}</div>
                                        </div>
                                        
                                        <div className="p-8 md:p-14 space-y-10">
                                            <div className="flex flex-wrap gap-4">
                                                <span className="text-xs font-black uppercase text-slate-300 w-full mb-2 tracking-[0.2em]">Item Availability:</span>
                                                {day.items.map(item => {
                                                    const count = getItemCount(day.id, item);
                                                    const isFull = count >= MAX_SLOTS;
                                                    return (
                                                        <span key={item} className={`px-4 py-2 md:px-5 md:py-3 rounded-2xl text-[10px] md:text-xs font-black uppercase border-2 flex items-center gap-2 md:gap-3 transition-all ${isFull ? 'bg-green-100 border-green-200 text-green-700 shadow-sm' : 'bg-slate-50 border-slate-100 text-slate-400'}`}>
                                                            {isFull && <span className="text-lg">✅</span>} {item} ({count}/{MAX_SLOTS})
                                                        </span>
                                                    )
                                                })}
                                            </div>

                                            <hr className="border-slate-100" />

                                            {!day.allow ? (
                                                <div className="bg-sky-50 border-4 border-dashed border-sky-200 p-10 md:p-12 rounded-[2.5rem] text-center text-sky-900 font-black">
                                                    <div className="text-6xl md:text-7xl mb-6">🌮</div>
                                                    <p className="text-2xl md:text-3xl uppercase tracking-tight mb-4">PTA is providing lunch!</p>
                                                    <p className="opacity-70 text-base md:text-lg italic leading-relaxed">No volunteer items are needed for Wednesday.</p>
                                                </div>
                                            ) : (
                                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-5">
                                                    <span className="text-xs font-black uppercase text-slate-300 col-span-full tracking-[0.2em]">Our Volunteers:</span>
                                                    {dayList.length === 0 ? (
                                                        <p className="col-span-full text-center text-slate-300 italic font-bold py-10 text-xl underline decoration-dotted">No sign-ups yet. Be the first!</p>
                                                    ) : dayList.map(s => (
                                                        <div key={s.id} className="bg-slate-50 p-6 rounded-[2rem] border-2 border-white shadow-sm flex justify-between items-center group hover:bg-white hover:border-slate-100 transition-all">
                                                            <div className="flex flex-col">
                                                                <p className="font-black text-slate-800 text-xl md:text-2xl leading-none tracking-tight">{s.name}</p>
                                                                <p className={`text-[11px] font-black uppercase mt-2 tracking-widest ${day.textColor}`}>{s.item}</p>
                                                            </div>
                                                            {isAdmin && (
                                                                <button onClick={() => eraseSignup(s.id)} className="bg-red-50 text-red-500 font-black text-xs uppercase px-4 py-2 rounded-xl hover:bg-red-500 hover:text-white transition-all shadow-md">Erase</button>
                                                            )}
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>

                        <footer className="text-center pt-24 border-t-2 border-slate-100">
                            <div className="flex justify-center gap-8 md:gap-14 mb-12">
                                <span className="text-5xl md:text-7xl drop-shadow-xl hover:scale-110 transition-transform cursor-default">🍎</span>
                                <span className="text-5xl md:text-7xl drop-shadow-xl hover:scale-110 transition-transform cursor-default">✏️</span>
                                <span className="text-5xl md:text-7xl drop-shadow-xl hover:scale-110 transition-transform cursor-default">🖍️</span>
                            </div>
                            <div className="flex flex-col items-center gap-6">
                                <p className="text-xs md:text-sm font-black uppercase text-slate-400 tracking-[0.4em]">Supporting Lampton Elementary</p>
                                <p className="text-[10px] md:text-xs font-black uppercase text-slate-500 tracking-[0.2em]">Design with <span className="text-yellow-500 text-lg">💛</span> by Scanista</p>
                                
                                {isAdmin ? (
                                    <div className="flex flex-col items-center gap-3">
                                        <div className="bg-green-100 text-green-700 px-6 py-2 rounded-full text-xs font-black uppercase border-2 border-green-200 shadow-sm">Admin Access Enabled</div>
                                        <button onClick={() => setIsAdmin(false)} className="text-[10px] font-black text-red-400 hover:text-red-600 uppercase tracking-widest transition-colors">Log Out</button>
                                    </div>
                                ) : (
                                    <button onClick={() => setShowAdmin(true)} className="text-[10px] text-slate-300 font-black uppercase hover:text-slate-500 transition-colors tracking-widest">Admin Portal</button>
                                )}
                            </div>
                        </footer>
                    </main>

                    {showAdmin && (
                        <div className="fixed inset-0 bg-slate-900/95 backdrop-blur-md z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-[3rem] p-8 md:p-12 w-full max-w-md border-4 border-blue-600 shadow-2xl animate-in fade-in zoom-in duration-300">
                                <h3 className="text-2xl md:text-3xl font-black uppercase mb-8 text-center text-slate-800 tracking-tighter">Admin Login</h3>
                                <input autoFocus type="password" placeholder="Password" className="w-full p-6 border-2 border-slate-100 rounded-2xl mb-6 font-bold text-center tracking-[0.5em] text-2xl md:text-3xl outline-none focus:border-blue-500 bg-slate-50 shadow-inner" value={adminInput} onChange={e => setAdminInput(e.target.value)} />
                                <div className="flex flex-col gap-4">
                                    <button onClick={() => { if(adminInput === 'Blue'){ setIsAdmin(true); setShowAdmin(false); setAdminInput(''); } else { alert('Incorrect Password'); } }} className="w-full py-5 bg-blue-600 text-white font-black text-xl md:text-2xl rounded-2xl uppercase shadow-2xl active:scale-[0.98] transition-all">Unlock Portal</button>
                                    <button onClick={() => setShowAdmin(false)} className="w-full py-2 text-xs font-black text-slate-400 uppercase tracking-widest">Cancel</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

```
