```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lampton Teacher Appreciation Sign-up</title>

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-HX3QW1SMSF"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-HX3QW1SMSF');
    </script>

    <!-- Tailwind & React Resources -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .clip-pennant { clip-path: polygon(0% 0%, 100% 0%, 50% 100%); }
        /* Hide root until React loads to prevent flicker */
        #root:empty { display: none; }
        .admin-glow { box-shadow: 0 0 15px rgba(59, 130, 246, 0.5); }
    </style>
</head>
<body class="bg-[#f8fafc]">
    <div id="root"></div>

    <!-- Firebase SDK Setup -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

        // Your specific Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyD_nLssSVEfRL-x1KM1574KHBIcnhdS4Ck",
            authDomain: "lampton-appreciation.firebaseapp.com",
            projectId: "lampton-appreciation",
            storageBucket: "lampton-appreciation.firebasestorage.app",
            messagingSenderId: "721268982987",
            appId: "1:721268982987:web:5d8b978e6f3dc69e7b91ce",
            measurementId: "G-HX3QW1SMSF"
        };

        const app = initializeApp(firebaseConfig);
        window.fbAuth = getAuth(app);
        window.fbDb = getFirestore(app);
        window.fbMethods = { collection, addDoc, onSnapshot, deleteDoc, doc, serverTimestamp, signInAnonymously, onAuthStateChanged };
    </script>

    <!-- The App Logic -->
    <script type="text/babel">
        const { useState, useEffect } = React;

        const MAX_SLOTS = 4;
        const DAYS = [
            { id: 'monday', name: 'Monday', theme: 'Coffee & Breakfast', items: ['Coffee', 'Bagels', 'Juice', 'Cream Cheese Tubs'], color: 'bg-red-500', textColor: 'text-red-700', allow: true, emoji: '☕' },
            { id: 'tuesday', name: 'Tuesday', theme: 'Fresh & Fancy', items: ['Fruit Platters', 'Charcuterie Board'], color: 'bg-purple-600', textColor: 'text-purple-700', allow: true, emoji: '🥗' },
            { id: 'wednesday', name: 'Wednesday', theme: 'PTA Provided Lunch', items: ['PTA will provide lunch'], color: 'bg-sky-500', textColor: 'text-sky-700', allow: false, emoji: '🌮' },
            { id: 'thursday', name: 'Thursday', theme: 'Sweet Treats', items: ['Cookies', 'Muffins'], color: 'bg-green-500', textColor: 'text-green-700', allow: true, emoji: '🍪' },
            { id: 'friday', name: 'Friday', theme: 'Thirst Quencher', items: ['Lemonade'], color: 'bg-orange-500', textColor: 'text-orange-700', allow: true, emoji: '🍋' }
        ];

        function App() {
            const [user, setUser] = useState(null);
            const [signups, setSignups] = useState([]);
            const [formData, setFormData] = useState({ name: '', item: '', dayId: 'monday' });
            const [isAdmin, setIsAdmin] = useState(false);
            const [adminInput, setAdminInput] = useState('');
            const [showAdmin, setShowAdmin] = useState(false);
            const [error, setError] = useState('');
            const [isDeleting, setIsDeleting] = useState(null);

            useEffect(() => {
                const checkFB = setInterval(() => {
                    if (window.fbMethods) {
                        clearInterval(checkFB);
                        window.fbMethods.signInAnonymously(window.fbAuth).catch(console.error);
                        window.fbMethods.onAuthStateChanged(window.fbAuth, setUser);
                    }
                }, 100);
            }, []);

            useEffect(() => {
                if (!user) return;
                const q = window.fbMethods.collection(window.fbDb, 'signups');
                return window.fbMethods.onSnapshot(q, (snapshot) => {
                    const data = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                    // Sort by timestamp if available
                    setSignups(data.sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0)));
                });
            }, [user]);

            const handleSignup = async (e) => {
                e.preventDefault();
                if (!formData.name || !formData.item) return setError("Please fill in all fields.");
                
                const currentCount = getItemCount(formData.dayId, formData.item);
                if (currentCount >= MAX_SLOTS) return setError("This slot is already full!");

                try {
                    await window.fbMethods.addDoc(window.fbMethods.collection(window.fbDb, 'signups'), {
                        ...formData,
                        timestamp: window.fbMethods.serverTimestamp(),
                        uid: user.uid
                    });
                    setFormData({...formData, item: ''});
                    setError('');
                } catch (err) { 
                    setError("Save failed. Make sure Firestore Rules are set to 'true'."); 
                }
            };

            const handleDelete = async (id) => {
                if (!isAdmin) return;
                setIsDeleting(id);
                try {
                    await window.fbMethods.deleteDoc(window.fbMethods.doc(window.fbDb, 'signups', id));
                } catch (err) {
                    console.error("Delete failed:", err);
                } finally {
                    setIsDeleting(null);
                }
            };

            const getItemCount = (dayId, item) => signups.filter(s => s.dayId === dayId && s.item === item).length;
            const selectedDay = DAYS.find(d => d.id === formData.dayId);

            return (
                <div className="pb-24">
                    {/* Pennant Header */}
                    <header className="bg-white border-b-4 border-blue-600 relative pt-12 pb-10 px-4 text-center shadow-md">
                        <div className="absolute top-0 left-0 right-0 flex justify-center -space-x-1">
                            {[...Array(20)].map((_, i) => (
                                <div key={i} className={`w-10 h-12 ${i % 2 === 0 ? 'bg-blue-600' : 'bg-yellow-400'} clip-pennant`}></div>
                            ))}
                        </div>
                        <h1 className="text-4xl md:text-7xl font-[1000] tracking-tighter uppercase leading-none text-slate-800">
                          Teacher & Staff <br/>
                          <span className="text-blue-700 font-black">Appreciation</span>
                        </h1>
                        <div className="inline-block bg-yellow-400 px-6 py-2 rounded-full font-black text-xl md:text-3xl text-blue-900 transform -rotate-1 shadow-lg border-2 border-blue-900 mt-4 uppercase">MAY 4-8, 2026</div>
                        <p className="mt-6 font-bold text-slate-500 italic">Lampton Elementary • Shared Sign-up Sheet</p>
                    </header>

                    <main className="max-w-4xl mx-auto px-4 mt-8 space-y-8">
                        {/* Signup Form */}
                        <section className="bg-white rounded-[2rem] shadow-xl p-6 md:p-10 border-2 border-slate-100">
                            <h3 className="text-2xl font-black mb-6 flex items-center gap-2">
                                <span className="text-blue-600 text-3xl">➕</span> Add My Item
                            </h3>
                            <form onSubmit={handleSignup} className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                <div className="flex flex-col">
                                    <label className="text-[10px] font-black uppercase text-slate-400 mb-1 ml-2">Volunteer Name</label>
                                    <input required placeholder="Your Name" className="p-4 rounded-2xl border-2 border-slate-100 font-bold outline-none focus:border-blue-500" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} />
                                </div>
                                <div className="flex flex-col">
                                    <label className="text-[10px] font-black uppercase text-slate-400 mb-1 ml-2">Select Day</label>
                                    <select className="p-4 rounded-2xl border-2 border-slate-100 bg-white font-bold" value={formData.dayId} onChange={e => setFormData({...formData, dayId: e.target.value, item: ''})}>
                                        {DAYS.filter(d => d.allow).map(d => <option key={d.id} value={d.id}>{d.name}</option>)}
                                    </select>
                                </div>
                                <div className="flex flex-col">
                                    <label className="text-[10px] font-black uppercase text-slate-400 mb-1 ml-2">Requested Item</label>
                                    <select required className="p-4 rounded-2xl border-2 border-slate-100 bg-white font-bold" value={formData.item} onChange={e => setFormData({...formData, item: e.target.value})}>
                                        <option value="">Choose item...</option>
                                        {selectedDay?.items.map(item => {
                                            const count = getItemCount(formData.dayId, item);
                                            return (
                                                <option key={item} value={item} disabled={count >= MAX_SLOTS}>
                                                    {item} ({count}/{MAX_SLOTS} filled)
                                                </option>
                                            )
                                        })}
                                    </select>
                                </div>
                                <button className="md:col-span-3 py-5 bg-blue-700 text-white font-black text-xl rounded-2xl uppercase tracking-widest shadow-lg active:scale-95 transition-all mt-2">Confirm Sign-up ❤️</button>
                                {error && <p className="text-red-500 font-bold text-center md:col-span-3 bg-red-50 p-2 rounded-xl">{error}</p>}
                            </form>
                        </section>

                        {/* Daily Cards */}
                        <div className="space-y-8">
                            {DAYS.map(day => {
                                const dayList = signups.filter(s => s.dayId === day.id);
                                return (
                                    <div key={day.id} className="bg-white rounded-[2.5rem] shadow-lg overflow-hidden border-2 border-slate-50">
                                        <div className={`${day.color} p-6 flex justify-between items-center text-white`}>
                                            <div>
                                                <h4 className="text-3xl md:text-5xl font-black uppercase leading-none tracking-tighter">{day.name}</h4>
                                                <p className="font-bold opacity-90 uppercase tracking-widest text-xs mt-1">{day.theme}</p>
                                            </div>
                                            <div className="text-4xl drop-shadow-md">{day.emoji}</div>
                                        </div>
                                        <div className="p-6 md:p-8 space-y-6">
                                            {/* Summary Pills */}
                                            <div className="flex flex-wrap gap-2">
                                                <span className="text-[10px] font-black uppercase text-slate-400 w-full mb-1">Items Requested:</span>
                                                {day.items.map((item, idx) => {
                                                    const count = getItemCount(day.id, item);
                                                    const isFull = count >= MAX_SLOTS;
                                                    return (
                                                        <span key={idx} className={`px-3 py-1.5 rounded-xl text-xs font-black uppercase border-2 flex items-center gap-2 ${isFull ? 'bg-green-100 border-green-200 text-green-700' : 'bg-slate-50 border-slate-200 text-slate-500'}`}>
                                                            {isFull && "✅"} {item} ({count}/{MAX_SLOTS})
                                                        </span>
                                                    )
                                                })}
                                            </div>
                                            
                                            <hr className="border-slate-100" />
                                            
                                            {/* Volunteer List */}
                                            {!day.allow ? (
                                                <div className="bg-sky-50 p-8 rounded-2xl text-center text-sky-800 font-black border-4 border-dashed border-sky-200">
                                                    PTA IS PROVIDING LUNCH!<br/>NO VOLUNTEER SIGN-UPS NEEDED.
                                                </div>
                                            ) : (
                                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                                    <span className="text-[10px] font-black uppercase text-slate-400 col-span-full">Volunteers:</span>
                                                    {dayList.length === 0 ? (
                                                      <p className="col-span-full text-center text-slate-300 italic font-bold py-4">No sign-ups yet. Be the first!</p>
                                                    ) : dayList.map(s => (
                                                        <div key={s.id} className="bg-slate-50 p-4 rounded-2xl border-2 border-white shadow-sm flex justify-between items-center group hover:bg-white hover:border-slate-100 transition-all">
                                                            <div>
                                                                <p className="font-black text-slate-800 leading-none">{s.name}</p>
                                                                <p className={`text-[10px] font-black uppercase mt-1 ${day.textColor}`}>{s.item}</p>
                                                            </div>
                                                            {isAdmin && (
                                                                <button 
                                                                    onClick={() => handleDelete(s.id)} 
                                                                    disabled={isDeleting === s.id}
                                                                    className="bg-red-50 text-red-500 font-black text-[10px] uppercase px-3 py-2 rounded-xl hover:bg-red-500 hover:text-white transition-all shadow-sm"
                                                                >
                                                                    {isDeleting === s.id ? '...' : 'Delete'}
                                                                </button>
                                                            )}
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>

                        {/* Footer */}
                        <footer className="text-center pt-10 border-t border-slate-200">
                            <div className="flex flex-col items-center gap-4">
                                <div className="text-3xl">🍎 ✏️ 🖍️</div>
                                <p className="text-[11px] text-slate-500 font-black uppercase tracking-widest">Design with 💛 by Scanista</p>
                                
                                {isAdmin ? (
                                    <div className="flex flex-col items-center gap-2">
                                        <div className="bg-blue-100 text-blue-700 px-4 py-1 rounded-full text-[10px] font-black uppercase border border-blue-200">Admin Mode Active</div>
                                        <button onClick={() => setIsAdmin(false)} className="text-red-400 font-bold text-[10px] uppercase hover:underline">Logout</button>
                                    </div>
                                ) : (
                                    <button onClick={() => setShowAdmin(true)} className="text-[10px] text-slate-300 font-bold uppercase hover:text-slate-500 transition-colors tracking-tighter">Admin Portal</button>
                                )}
                            </div>
                        </footer>
                    </main>

                    {/* Admin Modal */}
                    {showAdmin && (
                        <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-[2rem] p-10 w-full max-w-sm border-4 border-blue-600 shadow-2xl animate-in fade-in zoom-in duration-200">
                                <h3 className="text-2xl font-black uppercase mb-6 text-center text-slate-800">Admin Login</h3>
                                <input 
                                    autoFocus 
                                    type="password" 
                                    placeholder="Password" 
                                    className="w-full p-4 border-2 border-slate-100 rounded-2xl mb-4 font-bold text-center tracking-widest text-xl outline-none focus:border-blue-500" 
                                    value={adminInput} 
                                    onChange={e => setAdminInput(e.target.value)} 
                                />
                                <button 
                                    onClick={() => { 
                                        if(adminInput === 'Blue'){ 
                                            setIsAdmin(true); 
                                            setShowAdmin(false); 
                                            setAdminInput(''); 
                                        } else { 
                                            alert('Wrong Password'); 
                                        } 
                                    }} 
                                    className="w-full py-4 bg-blue-600 text-white font-black rounded-2xl uppercase shadow-lg active:scale-95 transition-all"
                                >
                                    Unlock Portal
                                </button>
                                <button onClick={() => setShowAdmin(false)} className="w-full mt-4 text-[10px] font-black text-slate-400 uppercase tracking-widest">Cancel</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // Wait for Firebase then Render
        const checkReady = setInterval(() => {
            if (window.fbMethods) {
                clearInterval(checkReady);
                const root = ReactDOM.createRoot(document.getElementById('root'));
                root.render(<App />);
                document.getElementById('root').style.display = 'block';
            }
        }, 100);
    </script>
</body>
</html>
