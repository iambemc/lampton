<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lampton Teacher Appreciation Sign-up</title>
    
    <!-- UI Frameworks -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; overflow-x: hidden; background-color: #f8fafc; color: #1e293b; }
        
        /* Festive Bunting */
        .bunting-flag { clip-path: polygon(0% 0%, 100% 0%, 50% 100%); }
        
        /* UI Interactions */
        .btn-press:active { transform: scale(0.98); }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Apple Shadow */
        .apple-shadow { filter: drop-shadow(0 4px 3px rgba(0, 0, 0, 0.15)); }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- Firebase Connection Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD_nLssSVEfRL-x1KM1574KHBIcnhdS4Ck",
            authDomain: "lampton-appreciation.firebaseapp.com",
            projectId: "lampton-appreciation",
            storageBucket: "lampton-appreciation.firebasestorage.app",
            messagingSenderId: "721268982987",
            appId: "1:721268982987:web:5d8b978e6f3dc69e7b91ce",
            measurementId: "G-HX3QW1SMSF"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Making Firebase accessible to the React portion
        window.portalFirebase = { auth, db, collection, addDoc, onSnapshot, deleteDoc, doc, serverTimestamp, signInAnonymously, onAuthStateChanged };
    </script>

    <!-- React Interface -->
    <script type="text/babel">
        const { useState, useEffect } = React;

        const MAX_SLOTS = 4;
        const DAYS = [
            { id: 'monday', name: 'Monday', theme: 'Breakfast Spread', items: ['Bagels', 'Orange Juice', 'Cream Cheese 8 oz.'], color: 'bg-[#ef4444]', textColor: 'text-red-700', allow: true, emoji: '🥯' },
            { id: 'tuesday', name: 'Tuesday', theme: 'Fresh & Fancy', items: ['Fruit Platters', 'Charcuterie Board'], color: 'bg-[#9333ea]', textColor: 'text-purple-700', allow: true, emoji: '🥗' },
            { id: 'wednesday', name: 'Wednesday', theme: 'PTA Provided Lunch', items: ['PTA Provided'], color: 'bg-[#0ea5e9]', textColor: 'text-sky-700', allow: false, emoji: '🌮' },
            { id: 'thursday', name: 'Thursday', theme: 'Sweet Treats', items: ['Cookies', 'Muffins'], color: 'bg-[#22c55e]', textColor: 'text-green-700', allow: true, emoji: '🍪' },
            { id: 'friday', name: 'Friday', theme: 'Thirst Quencher', items: ['Lemonade'], color: 'bg-[#f97316]', textColor: 'text-orange-700', allow: true, emoji: '🍋' }
        ];

        function App() {
            const [user, setUser] = useState(null);
            const [signups, setSignups] = useState([]);
            const [loading, setLoading] = useState(true);
            const [form, setForm] = useState({ name: '', item: '', dayId: 'monday' });
            const [isAdmin, setIsAdmin] = useState(false);
            const [showAdmin, setShowAdmin] = useState(false);
            const [adminInput, setAdminInput] = useState('');
            const [adminError, setAdminError] = useState(false);
            const [status, setStatus] = useState('');
            const [isSubmitting, setIsSubmitting] = useState(false);

            useEffect(() => {
                const checkFirebase = setInterval(() => {
                    if (window.portalFirebase) {
                        clearInterval(checkFirebase);
                        const fb = window.portalFirebase;
                        fb.signInAnonymously(fb.auth).catch(console.error);
                        fb.onAuthStateChanged(fb.auth, (u) => {
                            setUser(u);
                        });
                    }
                }, 100);
                return () => clearInterval(checkFirebase);
            }, []);

            useEffect(() => {
                if (!user || !window.portalFirebase) return;
                const fb = window.portalFirebase;
                
                // Listening to the 'signups' collection for real-time updates
                const unsubscribe = fb.onSnapshot(fb.collection(fb.db, 'signups'), (snap) => {
                    const data = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    setSignups(data);
                    setLoading(false);
                }, (err) => {
                    console.error("Connection Error:", err);
                    setLoading(false);
                });
                return () => unsubscribe();
            }, [user]);

            const handleSignup = async (e) => {
                e.preventDefault();
                if (!form.name || !form.item) return;
                setIsSubmitting(true);
                try {
                    const fb = window.portalFirebase;
                    await fb.addDoc(fb.collection(fb.db, 'signups'), { 
                        ...form, 
                        timestamp: fb.serverTimestamp() 
                    });
                    setForm({...form, item: ''});
                    setStatus("✅ Saved! Thank you!");
                    setTimeout(() => setStatus(''), 4000);
                } catch (err) { 
                    setStatus("❌ Save failed. Try again."); 
                } finally { 
                    setIsSubmitting(false); 
                }
            };

            const eraseSignup = async (id) => {
                if (!isAdmin) return;
                const fb = window.portalFirebase;
                await fb.deleteDoc(fb.doc(fb.db, 'signups', id));
            };

            const getCount = (dayId, item) => signups.filter(s => s.dayId === dayId && s.item === item).length;
            const currentDay = DAYS.find(d => d.id === form.dayId);

            return (
                <div className="pb-32 antialiased">
                    {/* Header Section */}
                    <header className="bg-white border-b-4 border-blue-600 relative pt-16 pb-12 px-4 text-center shadow-lg">
                        {/* Spaced out flags */}
                        <div className="absolute top-0 left-0 right-0 flex justify-center gap-8 overflow-hidden h-14">
                            {[...Array(6)].map((_, i) => (
                                <div key={i} className={`w-20 h-14 md:w-32 md:h-20 ${i%2===0?'bg-blue-600':'bg-yellow-400'} bunting-flag shadow-sm`}></div>
                            ))}
                        </div>
                        
                        <div className="max-w-4xl mx-auto mt-6">
                            <div className="flex items-center justify-center gap-4 md:gap-10 mb-4">
                                <span className="text-4xl md:text-8xl apple-shadow">🍎</span>
                                <h1 className="text-4xl md:text-8xl font-[1000] tracking-tighter uppercase leading-[0.85] text-slate-800">
                                    Teacher & Staff <br/><span className="text-blue-700">Appreciation</span>
                                </h1>
                                <span className="text-4xl md:text-8xl apple-shadow">🍎</span>
                            </div>
                            <div className="inline-block bg-yellow-400 px-12 py-4 rounded-full font-black text-2xl md:text-5xl text-blue-900 border-4 border-blue-900 shadow-xl uppercase tracking-tighter mt-4">MAY 4-8, 2026</div>
                        </div>
                        
                        {!loading && (
                            <div className="absolute bottom-2 right-4 flex items-center gap-2 text-[10px] font-black text-slate-300 uppercase tracking-widest">
                                <span className="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span> Connection Stable
                            </div>
                        )}
                    </header>

                    <main className="max-w-4xl mx-auto px-4 mt-12 space-y-12">
                        {/* Sign-up Form Section */}
                        <section className="bg-white rounded-[3rem] shadow-2xl p-8 md:p-12 border-2 border-slate-100 fade-in">
                            <h3 className="text-2xl md:text-3xl font-black mb-10 text-slate-800 flex items-center gap-3">
                                <span className="bg-blue-600 text-white p-2 rounded-2xl shadow-md text-xl">➕</span> Add My Item
                            </h3>
                            <form onSubmit={handleSignup} className="grid grid-cols-1 md:grid-cols-3 gap-8">
                                <div className="space-y-1">
                                    <label className="text-[10px] font-black uppercase text-slate-400 ml-3 tracking-widest">Name</label>
                                    <input required placeholder="Your Name" className="w-full p-5 rounded-[1.5rem] border-2 border-slate-100 font-bold bg-slate-50 text-lg outline-none focus:bg-white focus:border-blue-500 transition-all shadow-inner" value={form.name} onChange={e => setForm({...form, name: e.target.value})} />
                                </div>
                                <div className="space-y-1">
                                    <label className="text-[10px] font-black uppercase text-slate-400 ml-3 tracking-widest">Select Day</label>
                                    <select className="w-full p-5 rounded-[1.5rem] border-2 border-slate-100 bg-white font-bold cursor-pointer text-lg" value={form.dayId} onChange={e => setForm({...form, dayId: e.target.value, item: ''})}>
                                        {DAYS.filter(d => d.allow).map(d => <option key={d.id} value={d.id}>{d.name}</option>)}
                                    </select>
                                </div>
                                <div className="space-y-1">
                                    <label className="text-[10px] font-black uppercase text-slate-400 ml-3 tracking-widest">Choose Item</label>
                                    <select required className="w-full p-5 rounded-[1.5rem] border-2 border-slate-100 bg-white font-bold cursor-pointer text-lg" value={form.item} onChange={e => setForm({...form, item: e.target.value})}>
                                        <option value="">Select item...</option>
                                        {currentDay?.items.map(i => <option key={i} value={i} disabled={getCount(form.dayId, i) >= MAX_SLOTS}>{i} ({getCount(form.dayId, i)}/{MAX_SLOTS})</option>)}
                                    </select>
                                </div>
                                <button disabled={isSubmitting} className="md:col-span-3 py-6 bg-blue-700 text-white font-black text-2xl rounded-[1.5rem] uppercase tracking-widest shadow-xl btn-press disabled:opacity-50 transition-all hover:bg-blue-800">
                                    {isSubmitting ? "Saving..." : "Confirm Sign-up ❤️"}
                                </button>
                                {status && <div className="md:col-span-3 text-center font-black p-4 rounded-2xl bg-blue-50 text-blue-700 text-sm shadow-inner">{status}</div>}
                            </form>
                        </section>

                        {/* List of Days and Volunteers */}
                        <div className="space-y-12">
                            {DAYS.map(day => {
                                const list = signups.filter(s => s.dayId === day.id);
                                return (
                                    <div key={day.id} className="bg-white rounded-[3.5rem] shadow-xl overflow-hidden border border-slate-50 transition-transform hover:scale-[1.01] duration-300 fade-in">
                                        <div className={`${day.color} p-10 flex justify-between items-center text-white shadow-lg`}>
                                            <div>
                                                <h4 className="text-4xl md:text-8xl font-[1000] uppercase tracking-tighter leading-none">{day.name}</h4>
                                                <p className="font-bold opacity-90 uppercase tracking-widest text-xs mt-4">{day.theme}</p>
                                            </div>
                                            <div className="text-6xl md:text-9xl drop-shadow-2xl">{day.emoji}</div>
                                        </div>
                                        
                                        <div className="p-10 md:p-14 space-y-12">
                                            {/* Needed Items Summary */}
                                            <div className="space-y-4">
                                                <h5 className="text-[10px] font-black uppercase text-slate-300 tracking-[0.2em] mb-4 underline decoration-slate-100 underline-offset-8">What We Need:</h5>
                                                <div className="flex flex-wrap gap-4">
                                                    {day.items.map(item => {
                                                        const count = getCount(day.id, item);
                                                        const isFull = count >= MAX_SLOTS;
                                                        return (
                                                            <div key={item} className={`px-6 py-3 rounded-2xl border-2 flex items-center gap-4 transition-all ${isFull ? 'bg-green-100 border-green-200 text-green-700 shadow-md scale-105' : 'bg-slate-50 border-slate-100 text-slate-500'}`}>
                                                                <span className="font-black text-[10px] uppercase">{item}</span>
                                                                <span className={`text-[10px] font-black px-3 py-1 rounded-full ${isFull ? 'bg-green-600 text-white' : 'bg-slate-200 text-slate-500'}`}>
                                                                    {isFull ? "FULL" : `${count}/${MAX_SLOTS}`}
                                                                </span>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            </div>

                                            <hr className="border-slate-50" />

                                            {/* Volunteers List */}
                                            <div className="space-y-4">
                                                <h5 className="text-[10px] font-black uppercase text-slate-300 tracking-[0.2em] mb-4 underline decoration-slate-100 underline-offset-8">Our Volunteers:</h5>
                                                {!day.allow ? (
                                                    <div className="bg-sky-50 border-4 border-dashed border-sky-200 p-14 rounded-[3rem] text-center text-sky-900 font-[1000] text-3xl md:text-5xl uppercase tracking-tighter">PTA Provided Lunch! 🌮</div>
                                                ) : (
                                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-6">
                                                        {list.length === 0 ? (
                                                            <p className="col-span-full text-center text-slate-300 italic font-bold py-16 text-2xl underline decoration-dotted decoration-slate-200 tracking-tight">No sign-ups yet.</p>
                                                        ) : (
                                                            list.map(s => (
                                                                <div key={s.id} className="bg-slate-50 p-8 rounded-[2.5rem] border-2 border-white shadow-sm flex justify-between items-center group hover:bg-white transition-all duration-300 hover:shadow-xl">
                                                                    <div className="flex flex-col">
                                                                        <p className="font-[1000] text-slate-800 text-3xl leading-none tracking-tight">{s.name}</p>
                                                                        <p className={`text-[11px] font-black uppercase mt-3 tracking-widest ${day.textColor}`}>{s.item}</p>
                                                                    </div>
                                                                    {isAdmin && (
                                                                        <button onClick={() => eraseSignup(s.id)} className="bg-red-50 text-red-500 font-black text-[10px] px-5 py-3 rounded-xl border border-red-100 hover:bg-red-500 hover:text-white transition-all shadow-sm">Erase</button>
                                                                    )}
                                                                </div>
                                                            ))
                                                        )}
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>

                        {/* Footer Section */}
                        <footer className="text-center pt-24 border-t-2 border-slate-100 flex flex-col items-center gap-12 pb-20">
                            <div className="flex justify-center gap-12 md:gap-24 text-7xl md:text-8xl drop-shadow-2xl opacity-90">
                                <span>🍎</span><span>✏️</span><span>🖍️</span>
                            </div>
                            <div className="space-y-4 px-4">
                                <p className="text-lg font-[1000] uppercase text-slate-700 tracking-[0.5em]">Supporting Lampton Elementary</p>
                                <p className="text-slate-500 font-bold italic text-xl">Together we celebrate our amazing staff!</p>
                            </div>
                            
                            {/* Admin Portal Button */}
                            <div className="w-full max-w-xs px-4">
                                {isAdmin ? (
                                    <div className="flex flex-col items-center gap-4">
                                        <div className="bg-green-600 text-white px-8 py-3 rounded-2xl text-xs font-black uppercase tracking-widest shadow-lg flex items-center gap-2">
                                            <span>🔓</span> Admin Mode Active
                                        </div>
                                        <button onClick={() => setIsAdmin(false)} className="text-[10px] font-black text-red-500 uppercase underline decoration-2 underline-offset-8 hover:text-red-700 transition-colors">Log Out</button>
                                    </div>
                                ) : (
                                    <button onClick={() => setShowAdmin(true)} className="w-full bg-slate-200 hover:bg-slate-300 text-slate-700 font-black py-5 px-8 rounded-2xl text-xs uppercase tracking-widest transition-all shadow-md flex items-center justify-center gap-3">
                                        <span>🔒</span> Admin Portal Login
                                    </button>
                                )}
                            </div>
                            
                            <div className="pt-10 flex flex-col items-center gap-3">
                                <p className="text-[11px] text-slate-400 font-black uppercase tracking-[0.3em]">Developed by Scanista <span className="text-yellow-500">💛</span></p>
                                <p className="text-[9px] text-slate-300 font-medium">© 2026 Lampton Staff Appreciation Week</p>
                            </div>
                        </footer>
                    </main>

                    {/* Admin Login Modal */}
                    {showAdmin && (
                        <div className="fixed inset-0 bg-slate-900/95 backdrop-blur-md z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-[3.5rem] p-12 md:p-16 w-full max-w-md border-4 border-blue-600 shadow-2xl fade-in text-center">
                                <h3 className="text-3xl font-[1000] uppercase mb-10 text-slate-800 tracking-tighter">Admin Access</h3>
                                <input autoFocus type="password" placeholder="••••" className={`w-full p-6 border-2 rounded-2xl mb-2 font-black text-center tracking-[0.5em] text-4xl outline-none focus:bg-white shadow-inner bg-slate-50 ${adminError ? 'border-red-500' : 'border-slate-100 focus:border-blue-500'}`} value={adminInput} onChange={e => { setAdminInput(e.target.value); setAdminError(false); }} onKeyPress={e => e.key === 'Enter' && (adminInput === 'Blue' ? (setIsAdmin(true), setShowAdmin(false)) : setAdminError(true))} />
                                {adminError && <p className="text-red-500 text-[10px] font-black uppercase mb-6 tracking-widest">Access Denied</p>}
                                <div className="flex flex-col gap-4 mt-6">
                                    <button onClick={() => { if(adminInput === 'Blue'){ setIsAdmin(true); setShowAdmin(false); setAdminInput(''); } else { setAdminError(true); } }} className="w-full py-6 bg-blue-600 text-white font-[1000] text-2xl rounded-2xl uppercase shadow-xl transform active:scale-95 transition-all">Unlock Dashboard</button>
                                    <button onClick={() => { setShowAdmin(false); setAdminError(false); setAdminInput(''); }} className="text-slate-400 font-black uppercase text-[10px] tracking-widest mt-2">Cancel</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

```
