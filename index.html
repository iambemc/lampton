```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lampton Teacher Appreciation Sign-up</title>

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-HX3QW1SMSF"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-HX3QW1SMSF');
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .clip-pennant { clip-path: polygon(0% 0%, 100% 0%, 50% 100%); }
    </style>
</head>
<body class="bg-[#f8fafc]">
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD_nLssSVEfRL-x1KM1574KHBIcnhdS4Ck",
            authDomain: "lampton-appreciation.firebaseapp.com",
            projectId: "lampton-appreciation",
            storageBucket: "lampton-appreciation.firebasestorage.app",
            messagingSenderId: "721268982987",
            appId: "1:721268982987:web:5d8b978e6f3dc69e7b91ce",
            measurementId: "G-HX3QW1SMSF"
        };

        const app = initializeApp(firebaseConfig);
        window.fbAuth = getAuth(app);
        window.fbDb = getFirestore(app);
        window.fbMethods = { collection, addDoc, onSnapshot, deleteDoc, doc, serverTimestamp, signInAnonymously, onAuthStateChanged };
    </script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const MAX_SLOTS = 4;
        const DAYS = [
            { id: 'monday', name: 'Monday', theme: 'Coffee & Breakfast', items: ['Coffee', 'Bagels', 'Juice', 'Cream Cheese Tubs'], color: 'bg-red-500', textColor: 'text-red-600', allow: true, emoji: '☕' },
            { id: 'tuesday', name: 'Tuesday', theme: 'Fresh & Fancy', items: ['Fruit Platters', 'Charcuterie Board'], color: 'bg-purple-600', textColor: 'text-purple-600', allow: true, emoji: '🥗' },
            { id: 'wednesday', name: 'Wednesday', theme: 'PTA Provided Lunch', items: ['PTA will provide lunch'], color: 'bg-sky-500', textColor: 'text-sky-600', allow: false, emoji: '🌮' },
            { id: 'thursday', name: 'Thursday', theme: 'Sweet Treats', items: ['Cookies', 'Muffins'], color: 'bg-green-500', textColor: 'text-green-600', allow: true, emoji: '🍪' },
            { id: 'friday', name: 'Friday', theme: 'Thirst Quencher', items: ['Lemonade'], color: 'bg-orange-500', textColor: 'text-orange-600', allow: true, emoji: '🍋' }
        ];

        function App() {
            const [user, setUser] = useState(null);
            const [signups, setSignups] = useState([]);
            const [formData, setFormData] = useState({ name: '', item: '', dayId: 'monday' });
            const [isAdmin, setIsAdmin] = useState(false);
            const [adminInput, setAdminInput] = useState('');
            const [showAdmin, setShowAdmin] = useState(false);
            const [error, setError] = useState('');

            useEffect(() => {
                const checkFB = setInterval(() => {
                    if (window.fbMethods) {
                        clearInterval(checkFB);
                        window.fbMethods.signInAnonymously(window.fbAuth).catch(console.error);
                        window.fbMethods.onAuthStateChanged(window.fbAuth, setUser);
                    }
                }, 100);
            }, []);

            useEffect(() => {
                if (!user) return;
                const q = window.fbMethods.collection(window.fbDb, 'signups');
                return window.fbMethods.onSnapshot(q, (snapshot) => {
                    setSignups(snapshot.docs.map(d => ({ id: d.id, ...d.data() })));
                });
            }, [user]);

            const handleSignup = async (e) => {
                e.preventDefault();
                if (!formData.name || !formData.item) return setError("Fill in all fields.");
                try {
                    await window.fbMethods.addDoc(window.fbMethods.collection(window.fbDb, 'signups'), {
                        ...formData,
                        timestamp: window.fbMethods.serverTimestamp(),
                        uid: user.uid
                    });
                    setFormData({...formData, item: ''});
                    setError('');
                } catch (err) { setError("Save failed. Check Firebase Rules."); }
            };

            const getItemCount = (dayId, item) => signups.filter(s => s.dayId === dayId && s.item === item).length;
            const selectedDay = DAYS.find(d => d.id === formData.dayId);

            return (
                <div className="pb-20">
                    <header className="bg-white border-b-4 border-blue-600 relative pt-12 pb-10 px-4 text-center shadow-md">
                        <div className="absolute top-0 left-0 right-0 flex justify-center -space-x-1">
                            {[...Array(20)].map((_, i) => (
                                <div key={i} className={`w-10 h-12 ${i % 2 === 0 ? 'bg-blue-600' : 'bg-yellow-400'} clip-pennant`}></div>
                            ))}
                        </div>
                        <h1 className="text-4xl md:text-6xl font-[900] uppercase text-slate-800">Teacher & Staff Appreciation</h1>
                        <div className="inline-block bg-yellow-400 px-6 py-2 rounded-full font-black text-blue-900 mt-4 border-2 border-blue-900 shadow-lg transform rotate-1 uppercase">MAY 4-8, 2026</div>
                    </header>

                    <main className="max-w-4xl mx-auto px-4 mt-8 space-y-8">
                        <section className="bg-white rounded-[2rem] shadow-xl p-6 md:p-10 border-2 border-slate-100">
                            <h3 className="text-2xl font-black mb-6">➕ Add My Item</h3>
                            <form onSubmit={handleSignup} className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                <input required placeholder="Your Name" className="p-4 rounded-2xl border-2 border-slate-100 font-bold" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} />
                                <select className="p-4 rounded-2xl border-2 border-slate-100 bg-white font-bold" value={formData.dayId} onChange={e => setFormData({...formData, dayId: e.target.value, item: ''})}>
                                    {DAYS.filter(d => d.allow).map(d => <option key={d.id} value={d.id}>{d.name}</option>)}
                                </select>
                                <select required className="p-4 rounded-2xl border-2 border-slate-100 bg-white font-bold" value={formData.item} onChange={e => setFormData({...formData, item: e.target.value})}>
                                    <option value="">Select Item...</option>
                                    {selectedDay?.items.map(item => (
                                        <option key={item} value={item} disabled={getItemCount(formData.dayId, item) >= MAX_SLOTS}>
                                            {item} ({getItemCount(formData.dayId, item)}/{MAX_SLOTS})
                                        </option>
                                    ))}
                                </select>
                                <button className="md:col-span-3 py-5 bg-blue-700 text-white font-black text-xl rounded-2xl uppercase tracking-widest shadow-lg active:scale-95 transition-all">Confirm Sign-up ❤️</button>
                                {error && <p className="text-red-500 font-bold text-center md:col-span-3">{error}</p>}
                            </form>
                        </section>

                        <div className="space-y-8">
                            {DAYS.map(day => (
                                <div key={day.id} className="bg-white rounded-[2.5rem] shadow-lg overflow-hidden border-2 border-slate-50">
                                    <div className={`${day.color} p-6 flex justify-between items-center text-white`}>
                                        <div>
                                            <h4 className="text-3xl font-black uppercase leading-none">{day.name}</h4>
                                            <p className="font-bold opacity-90 uppercase tracking-widest text-xs mt-1">{day.theme}</p>
                                        </div>
                                        <div className="text-4xl">{day.emoji}</div>
                                    </div>
                                    <div className="p-6 md:p-8 space-y-4">
                                        <div className="flex flex-wrap gap-2">
                                            {day.items.map(item => (
                                                <span key={item} className="px-3 py-1 bg-slate-100 rounded-lg text-[10px] font-black uppercase text-slate-500">
                                                    {item} ({getItemCount(day.id, item)}/{MAX_SLOTS})
                                                </span>
                                            ))}
                                        </div>
                                        <hr className="border-slate-100" />
                                        {!day.allow ? (
                                            <div className="bg-sky-50 p-6 rounded-2xl text-center text-sky-800 font-black">PTA IS PROVIDING LUNCH!</div>
                                        ) : (
                                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                                {signups.filter(s => s.dayId === day.id).map(s => (
                                                    <div key={s.id} className="bg-slate-50 p-4 rounded-2xl border-2 border-white shadow-sm flex justify-between items-center">
                                                        <div>
                                                            <p className="font-black text-slate-800 leading-none">{s.name}</p>
                                                            <p className={`text-[10px] font-black uppercase mt-1 ${day.textColor}`}>{s.item}</p>
                                                        </div>
                                                        {isAdmin && <button onClick={() => window.fbMethods.deleteDoc(window.fbMethods.doc(window.fbDb, 'signups', s.id))} className="text-red-500 font-bold text-[10px] uppercase">Delete</button>}
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                </div>
                            ))}
                        </div>

                        <footer className="text-center pt-10">
                            <p className="text-[11px] text-slate-500 font-black uppercase tracking-widest">Design with 💛 by Scanista</p>
                            <button onClick={() => setShowAdmin(true)} className="text-[10px] text-slate-300 font-bold mt-4 uppercase">Admin Portal</button>
                        </footer>
                    </main>

                    {showAdmin && (
                        <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-[2rem] p-10 w-full max-w-sm border-4 border-blue-600">
                                <h3 className="text-2xl font-black uppercase mb-6 text-center text-slate-800">Admin Login</h3>
                                <input type="password" placeholder="Password" className="w-full p-4 border-2 border-slate-100 rounded-2xl mb-4 font-bold text-center tracking-widest text-xl outline-none" value={adminInput} onChange={e => setAdminInput(e.target.value)} />
                                <button onClick={() => { if(adminInput === 'Blue'){ setIsAdmin(true); setShowAdmin(false); setAdminInput(''); } else { alert('Wrong Password'); } }} className="w-full py-4 bg-blue-600 text-white font-black rounded-2xl uppercase shadow-lg">Unlock Portal</button>
                                <button onClick={() => setShowAdmin(false)} className="w-full mt-4 text-[10px] font-black text-slate-400 uppercase">Cancel</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
